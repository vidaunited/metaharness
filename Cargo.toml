[workspace]
members = [
    "crates/kernel",
    "crates/kernel-wasm",
    "crates/kernel-napi",
    "crates/template-catalog",
    "crates/poker-darwin",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ruvnet/agent-harness-generator"
homepage = "https://github.com/ruvnet/agent-harness-generator"
authors = ["rUv <ruv@ruv.net>"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
napi = { version = "2", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "2"
js-sys = "0.3"

# poker-darwin's tests drive real CFR/CFR+ training loops to convergence
# (Leduc/Hold'em exploitability, Darwin champion vs vanilla baseline). Under
# the unoptimised dev/test profile they dominated the Rust CI job — 16 min on
# ubuntu, 42 min on windows; locally `cargo test -p poker-darwin` took 20m20s
# with one unit test alone at 190s. Optimise just that crate for dev builds;
# `cargo test` uses the `test` profile, which inherits `dev` INCLUDING this
# per-package override (verified: `cargo test -p poker-darwin --no-run -v`
# passes `-C opt-level=3` to rustc for the crate's lib, unit-test harness and
# tests/*.rs). No test budget is shrunk or ignored — only the codegen changes.
[profile.dev.package.poker-darwin]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
